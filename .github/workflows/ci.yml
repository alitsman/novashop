name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    name: Regression
    uses: ./.github/workflows/regression.yml
    with:
      browsers: '["chromium"]'
      merge_gate: ${{ github.event_name == 'pull_request' }}
