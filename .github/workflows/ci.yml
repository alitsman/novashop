name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            automation/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Check backend
        working-directory: backend
        run: npm run check

      - name: Check automation
        working-directory: automation
        run: npm run check

  tests:
    name: Playwright tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      PORT: "4001"
      FRONTEND_URL: http://localhost:5173
      API_URL: http://localhost:4001
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/novashop_test
      JWT_SECRET: novashop-ci-only-jwt-secret-not-for-production

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novashop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novashop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            automation/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: automation
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: automation/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
