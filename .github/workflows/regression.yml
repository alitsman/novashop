name: Regression engine

on:
  workflow_call:
    inputs:
      scope:
        description: Execution boundary to run
        required: false
        type: string
        default: all
      feature:
        description: Functional feature to run
        required: false
        type: string
        default: all
      smoke_only:
        description: Whether to run only smoke tests
        required: false
        type: boolean
        default: false
      browsers:
        description: JSON array of browser engines for browser-based regression jobs
        required: false
        type: string
        default: '["chromium"]'
      full_regression:
        description: Whether to enable full-regression retry and flaky-test policy
        required: false
        type: boolean
        default: false
      merge_gate:
        description: Whether to produce the blocking regression gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  PORT: "4001"
  FRONTEND_URL: http://localhost:5173
  API_URL: http://localhost:4001
  VITE_API_URL: http://localhost:4001
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/novashop_test
  JWT_SECRET: novashop-ci-only-jwt-secret-not-for-production
  FEATURE: ${{ inputs.feature }}
  SMOKE_ONLY: ${{ inputs.smoke_only }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            automation/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Check backend
        working-directory: backend
        run: npm run check

      - name: Check automation
        working-directory: automation
        run: npm run check

  selection:
    name: Resolve selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      run_api_db: ${{ steps.resolve.outputs.run_api_db }}
      run_ui: ${{ steps.resolve.outputs.run_ui }}
      run_integrated: ${{ steps.resolve.outputs.run_integrated }}
      playwright_version: ${{ steps.playwright.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Resolve test selection
        id: resolve
        working-directory: automation
        env:
          SCOPE: ${{ inputs.scope }}
          BROWSERS: ${{ join(fromJSON(inputs.browsers), ',') }}
        run: npm run resolve:selection

      # Match the official browser container image to the installed Playwright version.
      - name: Resolve Playwright version
        id: playwright
        working-directory: automation
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  api-db:
    name: API + DB
    needs:
      - quality
      - selection
    if: ${{ needs.selection.outputs.run_api_db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novashop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novashop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            automation/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Run API and DB regression
        working-directory: automation
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-reports/api-db.zip
        run: |
          mkdir -p blob-reports
          npm run test:integrated -- \
            --project=api \
            --project=db \
            ${{ inputs.full_regression && '--retries=1 --fail-on-flaky-tests' || '--retries=0' }} \
            --output=test-results/api-db \
            --reporter=list,github,blob

      - name: Upload API and DB blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-api-db
          path: automation/blob-reports/api-db.zip
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  isolated-ui:
    name: Isolated UI (${{ matrix.browser }})
    needs:
      - quality
      - selection
    if: ${{ needs.selection.outputs.run_ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The official Playwright image includes browsers and system dependencies.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.selection.outputs.playwright_version }}-noble
      # Match the GitHub Actions runner UID, as recommended in Playwright's CI documentation.
      # This also avoids Firefox startup issues when running as root.
      options: --user 1001

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}

    env:
      BROWSERS: ${{ matrix.browser }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            automation/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Run isolated UI regression
        working-directory: automation
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-reports/ui-${{ matrix.browser }}.zip
        run: |
          mkdir -p blob-reports
          npm run test:ui -- \
            --project=ui-${BROWSERS} \
            ${{ inputs.full_regression && '--retries=1 --fail-on-flaky-tests' || '--retries=0' }} \
            --output=test-results/ui-${BROWSERS} \
            --reporter=${{ contains(inputs.browsers, ',') && 'list,blob' || 'list,github,blob' }}

      - name: Upload isolated UI blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-ui-${{ matrix.browser }}
          path: automation/blob-reports/ui-${{ matrix.browser }}.zip
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  integrated:
    name: Integrated (${{ matrix.browser }})
    needs:
      - quality
      - selection
    if: ${{ needs.selection.outputs.run_integrated == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The official Playwright image includes browsers and system dependencies.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.selection.outputs.playwright_version }}-noble
      # Match the GitHub Actions runner UID, as recommended in Playwright's CI documentation.
      # This also avoids Firefox startup issues when running as root.
      options: --user 1001

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}

    env:
      BROWSERS: ${{ matrix.browser }}
      # Job containers connect to services by their service name.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/novashop_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novashop_test
        options: >-
          --health-cmd "pg_isready -U postgres -d novashop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            automation/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Run integrated browser regression
        working-directory: automation
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-reports/integrated-${{ matrix.browser }}.zip
        run: |
          mkdir -p blob-reports
          npm run test:integrated -- \
            --project=hybrid-${BROWSERS} \
            --project=e2e-${BROWSERS} \
            ${{ inputs.full_regression && '--retries=1 --fail-on-flaky-tests' || '--retries=0' }} \
            --output=test-results/integrated-${BROWSERS} \
            --reporter=${{ contains(inputs.browsers, ',') && 'list,blob' || 'list,github,blob' }}

      - name: Upload integrated blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-integrated-${{ matrix.browser }}
          path: automation/blob-reports/integrated-${{ matrix.browser }}.zip
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  report-merge:
    name: Report merge
    needs:
      - api-db
      - isolated-ui
      - integrated
    if: >-
      ${{
        !cancelled() &&
        (
          needs.api-db.result != 'skipped' ||
          needs.isolated-ui.result != 'skipped' ||
          needs.integrated.result != 'skipped'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: blob-*
          path: automation/blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        working-directory: automation
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/merged
        run: npx playwright merge-reports --config=playwright.merge.config.ts --reporter=html blob-reports

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: automation/playwright-report/merged
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # "Regression gate" is the required status check in the Protect main ruleset.
  # Renaming this job or the calling job in ci.yml requires updating the ruleset.
  regression-gate:
    name: Regression gate
    needs:
      - quality
      - api-db
      - isolated-ui
      - integrated
    if: ${{ always() && inputs.merge_gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify required regression jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_DB_RESULT: ${{ needs.api-db.result }}
          ISOLATED_UI_RESULT: ${{ needs.isolated-ui.result }}
          INTEGRATED_RESULT: ${{ needs.integrated.result }}
        run: |
          echo "Quality: $QUALITY_RESULT"
          echo "API + DB: $API_DB_RESULT"
          echo "Isolated UI: $ISOLATED_UI_RESULT"
          echo "Integrated: $INTEGRATED_RESULT"

          if [[ "$QUALITY_RESULT" != "success" ||
                "$API_DB_RESULT" != "success" ||
                "$ISOLATED_UI_RESULT" != "success" ||
                "$INTEGRATED_RESULT" != "success" ]]; then
            exit 1
          fi
