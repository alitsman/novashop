x-backend-env: &backend-env
  PORT: "4000"
  DATABASE_URL: postgres://novashop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/novashop
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  FRONTEND_URL: http://localhost:8080

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: novashop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: novashop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novashop -d novashop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    image: novashop-backend:local
    command: ["node", "dist/db/runMigrations.js"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    image: novashop-backend:local
    environment: *backend-env
    ports:
      # Keep this host port in sync with frontend build.args.VITE_API_URL.
      - "127.0.0.1:4100:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/db').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Keep this URL in sync with the published backend host port.
        VITE_API_URL: http://localhost:4100
    image: novashop-frontend:local
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seed:
    profiles: ["tools"]
    image: novashop-backend:local
    command: ["node", "dist/db/seed.js"]
    environment:
      <<: *backend-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
